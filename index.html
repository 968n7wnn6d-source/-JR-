<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>日本全駅クイズ</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- =========================
         上部固定エリア
    ========================== -->

    <div class="top-area">

        <!-- 回答率 -->

        <div class="progress-bar">

            発見駅：
            <span id="found-count">0</span>
            /
            <span id="total-count">0</span>
            駅

            （
            <span id="progress-percent">0.0</span>
            %
            ）

        </div>


        <!-- 回答欄 -->

        <div class="answer-area">

            <input
                type="text"
                id="answer"
                placeholder="駅名を入力"
                autocomplete="off"
            >

            <button id="answer-button">
                回答
            </button>

            <button id="giveup-button">
                Give Up
            </button>

        </div>

    </div>



    <!-- =========================
         タイトル
    ========================== -->

    <header>

        <h1>日本全駅クイズ</h1>

        <p>
            駅名を入力して、日本全国の駅を埋めよう！
        </p>

    </header>



    <!-- =========================
         メイン
    ========================== -->

    <main>

        <div id="message"></div>

        <div id="routes-container"></div>

    </main>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
