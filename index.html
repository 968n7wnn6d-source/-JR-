<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>日本全駅クイズ</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- 画面上部の進捗表示 -->
    <div class="progress-bar">

        <span>発見駅：</span>
        <span id="found-count">0</span>
        <span> / </span>
        <span id="total-count">0</span>
        <span>駅</span>
        <span>（</span>
        <span id="progress-percent">0.0</span>
        <span>%）</span>

    </div>


    <!-- 回答欄 -->
    <section class="answer-area">

        <input
            type="text"
            id="answer"
            placeholder="駅名を入力"
            autocomplete="off"
        >

        <button id="answer-button">
            回答
        </button>

    </section>


    <!-- タイトル -->
    <header>

        <h1>日本全駅クイズ</h1>

        <p>
            駅名を入力して、全国の駅を見つけよう。
        </p>

    </header>


    <main>

        <!-- CSVから路線が自動生成される -->
        <div id="routes-container"></div>

        <!-- 正解・不正解メッセージ -->
        <p id="message"></p>

    </main>


    <script src="script.js"></script>

</body>

</html>
