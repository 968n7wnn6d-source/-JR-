<!DOCTYPE html>
<html lang="ja">

<head>
     <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8T5JHSN0Y"></script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>日本全駅クイズ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         最上部固定エリア
    ========================== -->

    <div class="top-area">


        <!-- 回答率・統計 -->

        <div class="progress-bar">

            <div class="progress-main">

                回答率
                <span id="found-count">0</span>
                /
                <span id="total-count">0</span>
                駅
                （
                <span id="progress-percent">0.0</span>
                %
                ）

            </div>


            <div class="statistics">

                <span>
                    全回答者の平均
                    <strong id="average-score">
                        --.-%
                    </strong>
                </span>

                <span class="statistics-separator">
                    |
                </span>

                <span>
                    全回答者の最高
                    <strong id="highest-score">
                        --.-%
                    </strong>
                </span>

            </div>

        </div>


        <!-- 回答エリア -->

        <div class="answer-area">


            <input
                type="text"
                id="answer"
                placeholder="駅名を入力"
                autocomplete="off"
            >


            <button
                id="answer-button"
            >
                回答
            </button>


            <button
                id="giveup-button"
            >
                Give Up
            </button>


        </div>

    </div>



    <!-- =========================
         ヘッダー
    ========================== -->

    <header>

        <h1>
            日本全駅クイズ
        </h1>

        <p>
            駅名を入力して、日本全国の駅を埋めよう！
        </p>

    </header>



    <!-- =========================
         メイン
    ========================== -->

    <main>

        <div id="message"></div>

        <div id="routes-container"></div>

    </main>



    <!-- =========================
         Supabase
    ========================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================
         JavaScript
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
